name: Release

# Legt automatisch ein Release an, sobald die Versionsnummer im Plugin-Kopf
# auf main steigt. Damit entfällt das manuelle Anlegen samt Zip-Upload —
# und genau diese Handarbeit war bisher die Fehlerquelle (falscher Tag,
# vergessenes Asset).
on:
  push:
    branches: [main]
    paths: ['repairffm-admin-tools.php']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: PHP-Syntax prüfen
        run: php -l repairffm-admin-tools.php

      # Zweimal ist bereits Code auf main gelandet, der nichts tat: einmal
      # ein vergessener Versions-Bump, einmal eine Funktion im eingebetteten
      # JavaScript, die definiert, aber nie aufgerufen wurde. Beides fiel
      # niemandem auf, weil beides syntaktisch einwandfrei ist.
      - name: Tote Funktionen im eingebetteten JavaScript
        run: |
          python3 - <<'EOF'
          import io, re, sys

          src = io.open('repairffm-admin-tools.php', encoding='utf-8').read()
          blocks = re.findall(r'<script[^>]*>(.*?)</script>', src, re.S)
          js = '\n'.join(blocks)

          tot = []
          for name in set(re.findall(r'function\s+([A-Za-z_$][\w$]*)\s*\(', js)):
              # Definition plus mindestens ein weiterer Treffer = wird benutzt
              if len(re.findall(r'\b' + re.escape(name) + r'\b', js)) < 2:
                  tot.append(name)

          if tot:
              for name in sorted(tot):
                  print('::error::%s() ist im eingebetteten JavaScript definiert, '
                        'wird aber nirgends aufgerufen.' % name)
              sys.exit(1)

          print('Keine toten Funktionen gefunden.')
          EOF

      - name: Version aus dem Plugin-Kopf lesen
        id: version
        run: |
          VERSION=$(grep -m1 -E '^[[:space:]]*\*[[:space:]]*Version:' repairffm-admin-tools.php \
            | sed -E 's/.*Version:[[:space:]]*//' | tr -d '[:space:][:cntrl:]')
          if [ -z "$VERSION" ]; then
            echo "::error::Keine Version im Plugin-Kopf gefunden."
            exit 1
          fi
          echo "Gefundene Version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Gibt es das Release schon?
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "Release ${{ steps.version.outputs.tag }} existiert bereits."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # Der Pfadfilter oben laesst diesen Lauf nur zu, wenn sich die
      # Plugin-Datei geaendert hat. Existiert das Release zu ihrer Version
      # trotzdem schon, wurde die Nummer im Plugin-Kopf vergessen - und der
      # Code ginge ohne Release und ohne Fehlermeldung auf main verloren.
      # Genau das ist am 21.08.2026 mit 1.9.0 passiert.
      - name: Version vergessen?
        if: github.event_name == 'push' && steps.check.outputs.exists == 'true'
        run: |
          echo "::error::Die Plugin-Datei wurde geaendert, aber ${{ steps.version.outputs.tag }} existiert bereits. Die Versionsnummer im Plugin-Kopf wurde vermutlich nicht hochgezaehlt - es entsteht kein Release."
          exit 1

      # Der Ordnername im Archiv MUSS dem Installationsordner entsprechen,
      # sonst installiert WordPress das Plugin unter neuem Namen und lässt
      # das alte deaktiviert zurück.
      - name: Zip bauen
        if: steps.check.outputs.exists == 'false'
        run: |
          mkdir -p build/repairffm-admin-tools
          cp repairffm-admin-tools.php build/repairffm-admin-tools/
          cd build
          zip -qr "../repairffm-admin-tools-${{ steps.version.outputs.version }}.zip" repairffm-admin-tools
          cd ..
          unzip -l "repairffm-admin-tools-${{ steps.version.outputs.version }}.zip"

      - name: Release anlegen und Zip anhängen
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            "repairffm-admin-tools-${{ steps.version.outputs.version }}.zip" \
            --title "${{ steps.version.outputs.tag }}" \
            --generate-notes
